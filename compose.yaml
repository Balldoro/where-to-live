services:
  api:
    build: ./apps/backend
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    networks: [backend, frontend]
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgis/postgis:18-3.6
    # postgis/postgis only publishes amd64 images; runs emulated on arm64 Macs.
    platform: linux/amd64
    shm_size: 256mb
    cap_drop: [ALL]
    # The entrypoint starts as root, fixes data dir ownership, then drops to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is missing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is missing}
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

networks:
  backend:
  frontend:

volumes:
  pgdata:
