name: Webapp CI

on:
  push:
    branches: [master]
    paths:
      - "apps/webapp/**"
      - "apps/backend/openapi.json"
      - ".github/workflows/webapp.yml"
  pull_request:
    paths:
      - "apps/webapp/**"
      - "apps/backend/openapi.json"
      - ".github/workflows/webapp.yml"

concurrency:
  group: webapp-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/webapp

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/webapp/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: apps/webapp/pnpm-lock.yaml
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: apps/webapp/Dockerfile
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check API client
        run: pnpm gen:api && git diff --exit-code src/lib/api.gen.ts
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
